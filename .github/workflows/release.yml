name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o DeckLCDDrivers.exe .
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" DeckLCDDrivers.exe --title "$GITHUB_REF_NAME" \
            --notes "Download DeckLCDDrivers.exe and run it on a Steam Deck LCD running Windows. It pulls the current driver list from Valve's support page and installs the APU, Wi-Fi, Bluetooth, SD card reader and audio drivers. The APU download is about 700 MB."
